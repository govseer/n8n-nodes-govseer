# One-off: writes package-lock.json for the pinned devDependencies and keeps it as an
# branch named lock, so it can be taken into main (npm is not reachable from the authoring machine).
name: Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci && npm run lint && npm run build
      - name: Push the lock to the lock branch
        if: always()
        run: |
          git config user.name "Govseer"
          git config user.email "hello@govseer.com"
          git checkout -B lock
          git add -f package-lock.json
          git commit -m "package-lock.json written in CI"
          git push -f origin lock
